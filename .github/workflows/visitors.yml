# Visitor statistics for the footer map: every 15 minutes, fetch the visit count and the
# visitors' countries from GoatCounter and commit them to assets/visitors.json (only when they changed).
# It also runs after every push to main. An open page fetches that file again every minute, so a new count shows without reloading.
# Needs the repository secret GOATCOUNTER_TOKEN (a GoatCounter API key that can read statistics).
name: Visitor statistics

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:                                   # and after every update of the site, as GitHub runs the timed ones late, or drops them, when it is busy
    branches: [main]                      # (the commits of this workflow itself, made with its own token, start no new run)

permissions:
  contents: write
  pages: write

concurrency:
  group: visitors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the counts from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 tools/visitors.py

      - name: Commit and publish the new counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/visitors.json; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitors.json
          git commit -m "Update visitor statistics"
          git pull --rebase origin main
          git push origin HEAD:main
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
